<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12141c" />
  <title>Musical Bingo — MC List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="mc-app" class="mc">
    <header class="mc__bar">
      <h1 id="mc-playlist-name" class="mc__title">MC List</h1>
      <div class="mc__bar-actions">
        <button id="clear-btn" class="btn btn--ghost" type="button">Clear</button>
        <button id="reset-btn" class="btn" type="button">Reset</button>
      </div>
    </header>

    <p id="mc-progress" class="mc__progress"></p>

    <ul id="mc-list" class="mc-list"></ul>

    <div id="no-playlist" class="empty-state" hidden>
      <h2>No playlist selected</h2>
      <p>
        Add <code>?playlist=NAME</code> to the URL, where <code>NAME</code>
        matches a file in the <code>playlists</code> folder.
      </p>
    </div>

    <div id="load-error" class="empty-state" hidden>
      <h2>Couldn't load that playlist</h2>
      <p id="load-error-detail"></p>
    </div>
  </div>

  <div id="reveal-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reveal-modal-title">
      <h2 id="reveal-modal-title">
        Reveal <span id="reveal-modal-song" class="modal__song"></span>?
      </h2>
      <p class="modal__hint">
        "Reveal" starts a 5-second countdown on the projector before
        showing the title.
      </p>
      <div class="modal__actions">
        <button id="reveal-btn" class="btn" type="button">Reveal</button>
        <button id="reveal-now-btn" class="btn" type="button">Reveal Now</button>
        <button id="cancel-reveal-btn" class="btn btn--ghost" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="mc.js"></script>
</body>
</html>
